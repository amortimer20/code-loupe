<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Code Animator Demo</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 2rem 16px 4rem;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.5;
        background: #f6f7f9;
        color: #1d1f23;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #121316; color: #e4e6eb; }
      }
      main { max-width: 64rem; margin: 0 auto; }
      h1 { margin: 0 0 0.25rem; font-size: 1.6rem; }
      p { margin: 0 0 1.5rem; opacity: 0.8; }
      kbd { font: inherit; font-size: 0.85em; padding: 0 0.35em; border: 1px solid currentColor; border-radius: 4px; opacity: 0.8; }
    </style>
    <script type="module" src="/src/index.ts"></script>
  </head>
  <body>
    <main>
      <h1>Code Animator</h1>
      <p>Step through with the buttons, or click the player and use <kbd>←</kbd> <kbd>→</kbd>, <kbd>Home</kbd> and <kbd>Space</kbd>.</p>
      <code-animator src="lessons/numeric-input.yaml" motion="full"></code-animator>
    </main>
  </body>
</html>
