title: Updating a dictionary field
language: python
code: |
  student = {"name": "Ada", "score": 5}
  student["score"] = 7
  print(student["score"])
steps:
  - line: 1
    allocate: { id: student-1, fields: { name: Ada, score: 5 } }
    assign: { var: student, ref: student-1 }
    caption: Create a dictionary with two named fields. student points to this one object; name holds "Ada" and score holds 5.
  - line: 2
    badge: { over: "7", value: 7 }
    caption: The key "score" identifies the field to change. We will store 7 there while leaving "name" unchanged.
  - update: { var: student, key: score, from: badge }
    caption: Replace the score field's value 5 with 7. The dictionary and student's reference keep the same identity.
  - line: 3
    badge: { over: 'student["score"]', value: 7, from: { var: student, key: score } }
    caption: Read the value stored under "score". The field supplies the integer 7 to print().
  - print: { text: "7", from: badge }
    caption: The console shows 7. The dictionary still has both fields, and name still holds "Ada".
